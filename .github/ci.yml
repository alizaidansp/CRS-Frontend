# Continuous Integration Workflow
# This workflow runs on every push and pull request to ensure code quality
# and prevent issues from being merged into the codebase.

name: CI

# Trigger on all pushes and pull requests to dev/main
on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ 'dev', 'main' ]

jobs:
  # First job: Security scanning with Trivy
  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    # Run Trivy vulnerability scanner
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH,MEDIUM'  # More strict for CI
        timeout: '5m'
        scanners: 'vuln,config,secret'  # Added secret scanning for CI

    # Upload Trivy scan results to GitHub Security
    - name: Upload Trivy scan results to GitHub Security
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'
        category: 'Trivy Scan'

  # Second job: Validate branch naming convention
  validate:
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    # Ensure branch names follow our convention
    - name: Validate branch name
      if: github.event_name == 'push'
      run: |
        BRANCH_NAME=${GITHUB_REF#refs/heads/}
        if [[ "$BRANCH_NAME" != "main" && "$BRANCH_NAME" != "dev" ]]; then
          if ! [[ "$BRANCH_NAME" =~ ^(feature|bugfix|hotfix|release)/[a-z0-9-]+$ ]]; then
            echo "❌ Error: Branch name '$BRANCH_NAME' does not follow the naming convention"
            echo "Branch names should be in the format: type/description"
            echo "Valid types: feature, bugfix, hotfix, release"
            echo "Example: feature/user-authentication"
            exit 1
          fi
        fi
        echo "✅ Branch name validation passed"

  # Third job: Run code quality checks
  code-quality:
    needs: [security-scan, validate]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    # Check for debugger statements that shouldn't be in production code
    - name: Check for debugger statements
      run: |
        echo "Checking for debugger statements..."
        if grep -r "debugger" src/; then
          echo "❌ Error: Debugger statements found!"
          echo "Found in the following files:"
          grep -r -n "debugger" src/ | while read -r line; do
            echo "  - $line" | sed 's/:/\n    Line /'
          done
          exit 1
        fi
        echo "✅ No debugger statements found"

    # Check for console.log statements that shouldn't be in production code
    - name: Check for console.log statements
      run: |
        echo "Checking for console.log statements..."
        if grep -r "console.log" src/; then
          echo "❌ Error: Console.log statements found!"
          echo "Found in the following files:"
          grep -r -n "console.log" src/ | while read -r line; do
            echo "  - $line" | sed 's/:/\n    Line /'
          done
          exit 1
        fi
        echo "✅ No console.log statements found"

    # Check for files that are too large (>5MB)
    - name: Check for large files
      run: |
        echo "Checking for large files..."
        LARGE_FILES=$(find src -type f -size +5M)
        if [ -n "$LARGE_FILES" ]; then
          echo "❌ Error: Files larger than 5MB found:"
          echo "$LARGE_FILES" | while read file; do
            size=$(du -h "$file" | cut -f1)
            echo "  - $file ($size)"
          done
          echo "Please remove large files or use a storage solution"
          exit 1
        fi
        echo "✅ No large files found"

  # Fourth job: Build and test the application
  build:
    needs: [security-scan, validate, code-quality]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    # Set up Node.js environment
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    # Install dependencies
    - name: Install dependencies
      run: npm ci
      
    # Run Angular linting
    - name: Run linting
      run: npm run lint
      
    # Run Jest tests
    - name: Run tests
      run: npm run test
      
    # Build the application
    - name: Build
      run: npm run build 